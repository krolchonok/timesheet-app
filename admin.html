<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ — все задачи</title>
  <script>(function(){try{var t=localStorage.getItem('timesheet-theme')||'default';if(t==='grid')document.documentElement.setAttribute('data-theme','grid');}catch(e){}})();</script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="new.css">
</head>
<body>
  <div class="app app--wide app--v2 app--v2-admin">
    <div class="v2-chrome">
      <div class="brand">
        <div class="brand__mark">TS</div>
        <div class="brand__text">
          <span class="brand__name">Timesheet</span>
          <span class="brand__tag">Админ</span>
        </div>
      </div>

      <nav class="admin-tabs v2-admin-tabs" aria-label="Режим админ-панели">
        <button type="button" class="admin-tabs__btn admin-tabs__btn--active" data-mode="view">Просмотр</button>
        <button type="button" class="admin-tabs__btn" data-mode="manage">Управление</button>
      </nav>

      <div class="v2-chrome__filters" id="toolbar-view">
        <div class="week-picker">
          <button type="button" class="week-picker__nav" id="week-prev" aria-label="Предыдущая неделя">←</button>
          <label class="week-picker__field">
            <span>Неделя</span>
            <select id="week-select"></select>
          </label>
          <button type="button" class="week-picker__nav" id="week-next" aria-label="Следующая неделя">→</button>
        </div>
        <label class="toolbar__field">
          <span>Поиск</span>
          <input type="text" id="search" placeholder="ФИО, задача...">
        </label>
        <span class="toolbar__hint" id="task-count"></span>
      </div>

      <div class="v2-chrome__actions">
        <button type="button" class="btn btn--secondary btn--small" id="btn-export">Экспорт CSV</button>
        <button type="button" class="theme-toggle" id="theme-toggle"></button>
        <button type="button" class="btn btn--ghost btn--small" id="btn-logout">Выйти</button>
        <span class="user-badge" id="user-badge"></span>
      </div>
    </div>

    <!-- Kept for admin.js mode copy updates; visually hidden -->
    <h1 class="v2-sr-only" id="admin-title">Просмотр</h1>
    <p class="v2-sr-only" id="admin-subtitle"></p>

    <section class="completion-panel" id="panel-view">
      <div class="completion-panel__head">
        <div>
          <h2>Кто заполнил</h2>
          <p class="completion-panel__summary" id="completion-summary"></p>
        </div>
        <div class="completion-panel__actions">
          <button type="button" class="btn btn--small btn--secondary" id="btn-show-all">Показать все</button>
          <button type="button" class="btn btn--small btn--ghost" id="btn-hide-all">Скрыть все</button>
          <button type="button" class="btn btn--small btn--secondary" id="btn-expand-all">Развернуть</button>
          <button type="button" class="btn btn--small btn--ghost" id="btn-collapse-all">Свернуть</button>
        </div>
      </div>
      <div id="completion-list" class="completion-list"></div>
    </section>

    <!-- users-list-toolbar kept for admin.js visibility toggle; buttons live above -->
    <div class="users-list-toolbar v2-sr-only" id="users-list-toolbar" aria-hidden="true"></div>

    <section class="manage-panel hidden" id="panel-manage">
      <div class="manage-block">
        <h3 class="manage-block__title">Сотрудники</h3>
        <form id="add-person-form" class="people-form">
          <input type="text" id="new-person-name" placeholder="Новое ФИО" required>
          <button type="submit" class="btn btn--primary btn--small">Добавить</button>
        </form>
        <div id="manage-people-list" class="manage-people-list"></div>
      </div>

      <div class="manage-block">
        <h3 class="manage-block__title">Категории задач</h3>
        <form id="add-category-form" class="people-form">
          <input type="text" id="new-category-name" placeholder="Название категории" required>
          <button type="submit" class="btn btn--secondary btn--small">Добавить</button>
        </form>
        <div id="category-list" class="project-templates"></div>
      </div>

      <div class="manage-block">
        <h3 class="manage-block__title">Типовые названия задач</h3>
        <form id="add-task-name-template-form" class="people-form">
          <input type="text" id="new-task-name-template" placeholder="Например: Совещание" required>
          <button type="submit" class="btn btn--secondary btn--small">Добавить</button>
        </form>
        <div id="task-name-template-list" class="project-templates"></div>
      </div>

      <div class="manage-block">
        <h3 class="manage-block__title">Сообщения о проблемах</h3>
        <p class="manage-block__hint">Сотрудники отправляют из меню «Ещё → Жалоба…» или шорткатом Ctrl+M (с выделенным элементом).</p>
        <div id="problem-reports-list" class="problem-reports-list"></div>
      </div>

      <div class="manage-block">
        <h3 class="manage-block__title">Настройки</h3>
        <label class="settings-check">
          <input type="checkbox" id="setting-allow-project-tasks">
          <span>Разрешить доп. проектные задачи у сотрудников</span>
        </label>
      </div>
    </section>

    <div id="users-list" class="users-list"></div>
    <p class="empty-hint hidden" id="empty-hint">Задач пока нет</p>
  </div>

  <div class="modal-overlay hidden" id="project-modal-overlay">
    <div class="modal" id="project-modal">
      <p class="modal__title">Новая проектная задача</p>
      <label class="modal__field">
        <span>Название проекта</span>
        <input type="text" id="project-name-input" placeholder="Например: Проект «Атлас»">
      </label>
      <div class="modal__actions">
        <button type="button" class="btn btn--ghost btn--small" id="btn-project-cancel">Отмена</button>
        <button type="button" class="btn btn--primary btn--small" id="btn-project-apply">Добавить</button>
      </div>
    </div>
  </div>

  <template id="completion-item-template">
    <div class="completion-item">
      <input type="checkbox" class="completion-item__checkbox" title="Показывать в списке">
      <span class="completion-item__status"></span>
      <span class="completion-item__name"></span>
      <span class="completion-item__meta"></span>
    </div>
  </template>

  <template id="manage-person-template">
    <div class="manage-person">
      <span class="manage-person__name"></span>
      <button type="button" class="btn btn--small btn--ghost manage-person__remove">Удалить</button>
    </div>
  </template>

  <template id="user-section-template">
    <section class="user-section">
      <div class="user-section__header" role="button" tabindex="0">
        <span class="user-section__toggle" aria-hidden="true">▾</span>
        <span class="user-section__name"></span>
        <span class="user-section__meta"></span>
        <button type="button" class="btn btn--small btn--secondary user-section__add-task">+ Задача</button>
        <button type="button" class="btn btn--small btn--secondary user-section__add-project hidden">+ Проект</button>
      </div>
      <div class="user-section__body">
        <div class="table-wrap">
          <table class="task-table task-table--admin">
            <thead>
              <tr>
                <th class="col-num">#</th>
                <th class="col-category">Категория</th>
                <th class="col-task">Название задачи</th>
                <th class="col-final-task">Итоговое наименование</th>
                <th class="col-status">Статус</th>
                <th class="col-day" data-day="mon">Пн</th>
                <th class="col-day" data-day="tue">Вт</th>
                <th class="col-day" data-day="wed">Ср</th>
                <th class="col-day" data-day="thu">Чт</th>
                <th class="col-day" data-day="fri">Пт</th>
                <th class="col-total">Σ</th>
                <th class="col-comment">Комментарии</th>
                <th class="col-actions"></th>
              </tr>
            </thead>
            <tbody class="user-task-body"></tbody>
            <tfoot>
              <tr>
                <td colspan="5" class="footer-label">Итого</td>
                <td class="day-total" data-day="mon">0</td>
                <td class="day-total" data-day="tue">0</td>
                <td class="day-total" data-day="wed">0</td>
                <td class="day-total" data-day="thu">0</td>
                <td class="day-total" data-day="fri">0</td>
                <td class="grand-total user-section__grand-total">0</td>
                <td colspan="2"></td>
              </tr>
            </tfoot>
          </table>
        </div>
        <p class="user-section__empty hidden">Нет задач у этого сотрудника</p>
      </div>
    </section>
  </template>

  <template id="row-project-view-template">
    <tr class="task-row task-row--project">
      <td class="col-num"></td>
      <td class="col-category cell-text">Проектные</td>
      <td class="col-task cell-text project-task-name"></td>
      <td class="col-final-task cell-text">—</td>
      <td class="col-status cell-text">—</td>
      <td class="col-day" data-day="mon">
        <input type="number" class="cell-input cell-input--hours" data-field="mon" min="0" max="24" step="0.5" value="0">
      </td>
      <td class="col-day" data-day="tue">
        <input type="number" class="cell-input cell-input--hours" data-field="tue" min="0" max="24" step="0.5" value="0">
      </td>
      <td class="col-day" data-day="wed">
        <input type="number" class="cell-input cell-input--hours" data-field="wed" min="0" max="24" step="0.5" value="0">
      </td>
      <td class="col-day" data-day="thu">
        <input type="number" class="cell-input cell-input--hours" data-field="thu" min="0" max="24" step="0.5" value="0">
      </td>
      <td class="col-day" data-day="fri">
        <input type="number" class="cell-input cell-input--hours" data-field="fri" min="0" max="24" step="0.5" value="0">
      </td>
      <td class="col-total row-total"></td>
      <td class="col-comment cell-text">—</td>
      <td class="col-actions"></td>
    </tr>
  </template>

  <template id="row-view-template">
    <tr class="task-row">
      <td class="col-num"></td>
      <td class="col-category cell-text"></td>
      <td class="col-task">
        <textarea class="cell-input" data-field="task" rows="1" placeholder="Название задачи"></textarea>
      </td>
      <td class="col-final-task">
        <div class="final-task-cell">
          <textarea class="cell-input" data-field="final_task" rows="1" placeholder="Итоговое название"></textarea>
          <button type="button" class="btn btn--small btn--secondary btn-transfer" title="Перенести название задачи">→</button>
        </div>
      </td>
      <td class="col-status">
        <select class="cell-select" data-field="status"></select>
      </td>
      <td class="col-day" data-day="mon">
        <input type="number" class="cell-input cell-input--hours" data-field="mon" min="0" max="24" step="0.5" value="0">
      </td>
      <td class="col-day" data-day="tue">
        <input type="number" class="cell-input cell-input--hours" data-field="tue" min="0" max="24" step="0.5" value="0">
      </td>
      <td class="col-day" data-day="wed">
        <input type="number" class="cell-input cell-input--hours" data-field="wed" min="0" max="24" step="0.5" value="0">
      </td>
      <td class="col-day" data-day="thu">
        <input type="number" class="cell-input cell-input--hours" data-field="thu" min="0" max="24" step="0.5" value="0">
      </td>
      <td class="col-day" data-day="fri">
        <input type="number" class="cell-input cell-input--hours" data-field="fri" min="0" max="24" step="0.5" value="0">
      </td>
      <td class="col-total row-total"></td>
      <td class="col-comment">
        <textarea class="cell-input" data-field="comment" rows="1" placeholder="Комментарий"></textarea>
      </td>
      <td class="col-actions">
        <button type="button" class="btn-icon btn-delete" title="Удалить задачу" aria-label="Удалить задачу">×</button>
      </td>
    </tr>
  </template>

  <script src="week.js"></script>
  <script src="api.js"></script>
  <script src="table-resize.js"></script>
  <script src="feedback.js"></script>
  <script src="admin.js"></script>
</body>
</html>
