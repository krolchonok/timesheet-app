# Пример reverse-proxy для Timesheet (ставится на ОТДЕЛЬНОМ ПК с nginx).
# App-сервер слушает http://APP_IP:APP_PORT (по умолчанию :8888).
#
#   sudo cp deploy/nginx-timesheet.conf /etc/nginx/sites-available/timesheet
#   sudo ln -sf /etc/nginx/sites-available/timesheet /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream timesheet_backend {
    server 192.168.1.10:8888;
    keepalive 8;
}

server {
    listen 80;
    server_name timesheet.example.com;

    location / {
        proxy_pass http://timesheet_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

